# A Hekate workflow: https://donquinleone.github.io/Hekate/use/workflow-files/
hekate: workflow/1
name: Conductor first
groups:
  first: The conductor first
  then: Then everyone else
nodes:
  - id: start
    event: upload
    name: A version is uploaded
    at: [0, 0]
  - id: notes
    action: feedback
    name: Conductor's notes
    group: first
    with:
      who: Conductor
      status: With the conductor
      due: "3"
    at: [320, 0]
  - id: edit
    action: task
    name: Edits
    group: first
    with:
      who: Producer
      status: Editing
    at: [640, 0]
  - id: approval
    action: approval
    name: Soloists and label
    group: then
    with:
      who: Soloists, Reviewer
      order: In turn
      rule: Everyone approves
      status: With the soloists and label
    at: [960, 0]
  - id: done
    action: finish
    name: Approved
    with:
      status: Approved
    at: [1280, 0]
  - id: tell
    action: notify
    name: Tell the producer
    with:
      to: Producer
      message: "Some approved, some did not: decide what follows."
    at: [1280, 120]
  - id: held
    action: finish
    name: Decision needed
    with:
      status: Decision needed
    at: [1600, 120]
connectors:
  - id: c1
    from: start.happened
    to: notes
  - id: c2
    from: notes.done
    to: edit
  - id: c3
    from: notes.overdue
    to: edit
  - id: c4
    from: edit.done
    to: approval
  - id: c5
    from: approval.approved
    to: done
  - id: c6
    from: approval.changes
    to: edit
    until: 3
  - id: c7
    from: approval.mixed
    to: tell
  - id: c8
    from: tell.sent
    to: held
