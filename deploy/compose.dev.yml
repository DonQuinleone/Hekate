# PostgreSQL for local development. The app runs on the host with `pnpm dev`.
name: hekate-dev

services:
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: hekate
      POSTGRES_PASSWORD: hekate
      POSTGRES_DB: hekate
    ports: ["5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
