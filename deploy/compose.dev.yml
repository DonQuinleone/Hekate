# PostgreSQL for local development. The app runs on the host with `pnpm dev`.
name: hekate-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hekate
      POSTGRES_PASSWORD: hekate
      POSTGRES_DB: hekate
    ports: ["5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
