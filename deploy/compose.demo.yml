# Trying Hekate on one machine, with no domain: the app on http://localhost:3000, without
# Caddy, built from this checkout. With .env copied from .env.example and POSTGRES_PASSWORD set:
#   docker compose --env-file .env -f deploy/compose.yml -f deploy/compose.build.yml -f deploy/compose.laptop.yml up -d --build
# The address it serves on is one the app can also reach from inside its own container, which
# the installer's address check needs; https://localhost through Caddy would be Caddy's, not
# the app's. Passkeys and links from other devices need HTTPS on a real domain: see Install.
services:
  app:
    ports: ["3000:3000"]
    environment:
      PUBLIC_URL: http://localhost:3000
  # Not started here (it needs a domain and ports 80 and 443); `--profile https` brings it back.
  caddy:
    profiles: [https]
