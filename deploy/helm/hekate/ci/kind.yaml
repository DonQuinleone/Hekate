# On kind: the image built by CI, loaded into the cluster, and no Ingress controller.
image:
  repository: hekate
  tag: ci
  pullPolicy: Never
ingress:
  enabled: false
# The drill sets the instance up; it never depends on a service outside the machine.
env:
  HEKATE_UPDATE_CHECK: "false"
  PASSWORD_LEAK_CHECK: "false"
