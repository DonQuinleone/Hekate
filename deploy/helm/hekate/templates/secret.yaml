{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hekate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hekate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "hekate.secretData" . | nindent 2 }}
{{- end }}
