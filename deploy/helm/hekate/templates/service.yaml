apiVersion: v1
kind: Service
metadata:
  name: {{ include "hekate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hekate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hekate.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
