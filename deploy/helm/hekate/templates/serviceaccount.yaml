{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hekate.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hekate.labels" . | nindent 4 }}
# Hekate never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
