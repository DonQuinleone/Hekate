{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required, as in publicUrl" .Values.ingress.host -}}
{{- $hosts := list $host -}}
{{- if .Values.ingress.wildcard }}{{ $hosts = append $hosts (printf "*.%s" $host) }}{{ end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hekate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hekate.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "hekate.fullname" .)) }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hekate.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
