# Self-hosted Hekate: the app, PostgreSQL and Caddy (automatic HTTPS).
# Usage: cp .env.example .env, set HEKATE_DOMAIN and POSTGRES_PASSWORD, then:
#   docker compose -f deploy/compose.yml up -d
# and open https://HEKATE_DOMAIN with the setup code from: docker compose -f deploy/compose.yml logs app
# The installer does the rest; anything also set in .env is shown as fixed and never overwritten.
# The app is the released, signed image. To build it from this checkout instead:
#   docker compose -f deploy/compose.yml -f deploy/compose.build.yml up -d --build
name: hekate

services:
  app:
    # The release this file came with; HEKATE_VERSION picks another.
    image: ghcr.io/donquinleone/hekate:${HEKATE_VERSION:-0.1.0} # x-release-please-version
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_SECONDS (30 by default), so the app drains and finishes what
    # is under way before Docker would kill it (#193).
    stop_grace_period: 40s
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://hekate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/hekate
      MIGRATE_ON_START: "true"
      # Caddy sets X-Forwarded-For to the real client address.
      TRUST_PROXY: "true"
      PUBLIC_URL: https://${HEKATE_DOMAIN:-localhost}
      # The media volume, whatever .env says for development.
      STORAGE_LOCAL_PATH: /data/storage
      # AUTH_SECRET and MASTER_KEY come from .env when set there; otherwise the installer makes
      # them and keeps them in the settings volume (/config/hekate.env).
    volumes:
      - media:/data
      # The installer's settings, the master key among them: apart from the media, so a copy of
      # the media never carries the key that opens it.
      - settings:/config
    # Nothing in the image is written to: media goes to /data, scratch to memory.
    read_only: true
    # Decrypted media exists only while a job runs; keep it in memory, never on disk.
    # Raise the size for very long multitrack sessions.
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /tmp/hekate-work:size=${HEKATE_WORK_SIZE:-8g},mode=0700,uid=1000,gid=1000
    # To encode H.264 on an Intel or AMD GPU, set VIDEO_HARDWARE=/dev/dri/renderD128 in .env
    # and pass the device, with the host's render group so the app may open it:
    # devices: ["/dev/dri/renderD128:/dev/dri/renderD128"]
    # group_add: ["${HEKATE_RENDER_GID:-109}"]
    # It needs no Linux capability and may never gain one.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hekate
      POSTGRES_DB: hekate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hekate -d hekate"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HEKATE_DOMAIN: ${HEKATE_DOMAIN:-localhost}
    volumes:
      # Caddyfile.subdomains for workspace subdomains (#176): HEKATE_CADDYFILE in .env.
      - ./${HEKATE_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

volumes:
  media:
  settings:
  postgres:
  caddy-data:
  caddy-config:
