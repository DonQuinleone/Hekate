name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hekate
          POSTGRES_PASSWORD: hekate
          POSTGRES_DB: hekate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hekate" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hekate:hekate@localhost:5432/hekate
      # The S3 storage conformance suite runs against Versity Gateway, an S3 server backed by a directory.
      VERSITYGW_VERSION: v1.9.0
      VERSITYGW_SHA256: 0c28ccda3452451d7c71a0427f6aa7d0db5cac5e2b98a8e4dd2970967e1aadc1
      S3_TEST_ENDPOINT: http://127.0.0.1:7070
      S3_TEST_BUCKET: hekate-test
      S3_TEST_ACCESS_KEY_ID: hekate-ci
      S3_TEST_SECRET_ACCESS_KEY: hekate-ci-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg and Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg poppler-utils fonts-dejavu-core
      # The LDAP tests run against OpenLDAP from Ubuntu's own packages, with the fixtures in
      # apps/server/test/ldap. Its own service is not started; the script runs one of its own.
      - name: Start an LDAP directory
        run: |
          echo "slapd slapd/no_configuration boolean true" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends slapd ldap-utils
          sudo systemctl stop slapd || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd 2>/dev/null || true
          echo "LDAP_TEST_URL=$(sudo LDAP_TEST_DIR=/var/lib/ldap/hekate-test apps/server/test/ldap/start.sh)" >> "$GITHUB_ENV"
      # The single sign-on tests run against Keycloak (OIDC and SAML), from Docker Hub pinned by
      # digest, with the realm in apps/server/test/keycloak.
      - name: Start an identity provider
        run: echo "KEYCLOAK_URL=$(apps/server/test/keycloak/start.sh)" >> "$GITHUB_ENV"
      - name: Start an S3-compatible server
        run: |
          archive="versitygw_${VERSITYGW_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/versity/versitygw/releases/download/${VERSITYGW_VERSION}/${archive}"
          echo "${VERSITYGW_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/s3/$S3_TEST_BUCKET"
          "$RUNNER_TEMP/versitygw_${VERSITYGW_VERSION}_Linux_x86_64/versitygw" \
            --access "$S3_TEST_ACCESS_KEY_ID" --secret "$S3_TEST_SECRET_ACCESS_KEY" --port :7070 \
            posix "$RUNNER_TEMP/s3" > "$RUNNER_TEMP/versitygw.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null "$S3_TEST_ENDPOINT" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/versitygw.log"
          exit 1
      - run: pnpm check
      - run: pnpm build
      # Dependencies, secrets and misconfiguration in the repository. Fails on any fixable finding.
      - name: Exceptions to the scanners have an issue and an expiry
        run: scripts/check-trivyignore.sh
      - name: Trivy (repository)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          # Every severity fails the build while a fix exists; unfixed findings are reported
          # below. Exceptions live in .trivyignore, each with an issue and an expiry date.
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          version: v0.75.0
      - name: Trivy SARIF (repository)
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-repo.sarif
          trivyignores: .trivyignore
          skip-setup-trivy: true
      - name: Upload to code scanning
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repository

  # Every screen, seeded with known media, at desktop and phone width: layout and
  # accessibility checked, with the captures kept as a build artefact.
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hekate
          POSTGRES_PASSWORD: hekate
          POSTGRES_DB: hekate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hekate" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://hekate:hekate@localhost:5432/hekate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg and Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg poppler-utils fonts-dejavu-core
      - name: Install Chromium
        run: pnpm --filter @hekate/e2e exec playwright install --with-deps chromium
      # The design system reference is built in for the suite to capture; releases leave it out.
      - run: pnpm --filter @hekate/web build
        env:
          VITE_REFERENCE: "1"
      # The key the suite's instance is encrypted with, kept for the restore drill.
      - run: echo "E2E_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm --filter @hekate/e2e e2e
      # Back up the seeded instance, restore it somewhere new, and verify the restore.
      - name: Restore drill
        run: scripts/backup-drill.sh
      - name: Keep the captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screens
          path: apps/e2e/test-results/screens
          if-no-files-found: ignore

  # Added or updated dependencies: no known vulnerability at any severity, and only licences
  # that can be combined with AGPL-3.0.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # Build and test dependencies run on our machines and in CI too.
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            0BSD, AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, Apache-2.0, BlueOak-1.0.0,
            BSD-2-Clause, BSD-3-Clause, CC-BY-3.0, CC-BY-4.0, CC0-1.0, GPL-3.0, GPL-3.0-only,
            GPL-3.0-or-later, ISC, LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0,
            LGPL-3.0-only, LGPL-3.0-or-later, MIT, MIT-0, MPL-2.0, Python-2.0, Unlicense,
            Zlib
          comment-summary-in-pr: never

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: hekate:ci
      # As Compose runs it: read-only, every capability dropped, no new privileges.
      - name: The image runs hardened
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v "$PWD/scripts/image-smoke.mjs:/smoke.mjs:ro" hekate:ci /smoke.mjs
      # Operating system and package vulnerabilities in the app image.
      - name: Trivy (image)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hekate:ci
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          version: v0.75.0
      - name: Trivy SARIF (image)
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hekate:ci
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif
          trivyignores: .trivyignore
          skip-setup-trivy: true
      - name: Upload to code scanning
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
